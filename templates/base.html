<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kannada for Everyone{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="/" class="logo">Kannada<span>For Everyone</span></a>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/lessons">Lessons</a>
                <a href="/conversations">Conversations</a>
                <a href="/quiz">Quiz</a>
                <a href="/progress">Progress</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>© 2026 Kannada for Everyone | Learn Kannada, Connect with Everyone.</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
